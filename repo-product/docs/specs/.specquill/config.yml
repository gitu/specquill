# specquill workspace config — the SpecQuill product specs themselves.
# Statuses, ID schemes, drivers and link types run on the built-in
# WHY/WHAT/HOW/WHEN defaults; only this workspace's additions are configured.
# (The property schema still lives in .specquill/schema.json here — the
# legacy stand-alone form, honored while config.yml has no properties: section.)
version: 2
project: specquill-docs
default_branch: main

ui:
  default_view: editor

# custom document families beyond the built-ins — labeled in the tree and
# the Model view; new files under these folders get the entity's type
entities:
  decision: { group: why, folder: "decisions/", label: "Decisions", icon: "◆", color: "#7c5cd6", description: "Architecture decision records — the WHY behind the system's shape, with the alternatives that were rejected." }
  glossary: { folder: "glossary/", label: "Glossary", icon: "❡", color: "#12876a", description: "Shared vocabulary — terms with a precise meaning used consistently across these specs." }

# this workspace predates the drivers/implements/delivers defaults and keeps
# its satisfies convention — declaring it here keeps the links typed (a
# declared link_types section replaces the built-in defaults wholesale)
link_types:
  drivers:    { from: requirement,  to: [regulation, decision] } # WHAT -> WHY
  satisfies:  { from: spec,         to: requirement }            # HOW -> WHAT
  delivers:   { from: work_item,    to: [spec, requirement] }    # WHEN -> HOW
  maps_to:    { from: spec,         to: data_field }
  verifies:   { from: requirement,  to: test }

# In forge-PAT deployments (no server-side catalog) the SpecQuill
# implementation repo itself is a read-only reference, defined right here and
# cloned with each user's own token — the speccy can navigate the source to
# check specs against what is actually built. Catalog deployments ignore the
# definition and show the reference as an Overview warning instead.
sources:
  - name: specquill-src
    remote: https://github.com/gitu/specquill.git

references:
  - source: specquill-src
