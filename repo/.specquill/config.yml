# specquill workspace config — the built-in WHY/WHAT/HOW/WHEN model covers
# entities, drivers, statuses and link types; only what THIS workspace adds
# or overrides is spelled out. Model view → "sample config" shows the full
# default setup.
version: 2
project: trading-specs
default_branch: main

# view shown when opening the workspace (users can override in Settings)
ui:
  default_view: editor

# custom document families — product drivers are first-class documents;
# `driver: product` types every drivers-link that points into products/
entities:
  product_driver: { group: why, driver: product, folder: "products/", label: "Products", icon: "◆", color: "#2563c9", description: "Product asks driving requirements — SLAs, PM requests, commitments with an owner and a date." }

# property schema for THIS workspace (replaces the built-in default — the
# trading specs carry regulatory attributes like authority/jurisdiction)
properties:
  order: [id, type, authority, jurisdiction, status, priority, business_value, coverage, owner, value_statement, drivers, implements, maps_to, verifies, diagrams, anchors, source_system, target_model, updated]
  fields:
    id: { label: "ID", type: code }
    type: { label: "Type", type: tag }
    authority: { label: "Authority", type: tag }
    jurisdiction: { label: "Jurisdiction", type: tag }
    status: { label: "Status", type: enum, values: { draft: slate, in_review: amber, approved: green, active: green, deprecated: slate, triage: amber } }
    priority: { label: "Priority", type: enum, values: { must: amber, should: blue, could: slate } }
    business_value: { label: "Business value", type: enum, values: { high: green, medium: blue, low: slate } }
    coverage: { label: "Coverage", type: percent }
    owner: { label: "Owner", type: user }
    value_statement: { label: "Value statement", type: text }
    drivers: { label: "Drivers", type: links }
    implements: { label: "Implements", type: links }
    maps_to: { label: "Maps to", type: links }
    verifies: { label: "Verified by", type: code }
    diagrams: { label: "Diagrams", type: links }
    anchors: { label: "Anchors", type: code }
    source_system: { label: "Source system", type: tag }
    target_model: { label: "Target model", type: code }
    updated: { label: "Updated", type: date }

# forge-PAT deployments have no server-side catalog — sources are DEFINED
# here instead and cloned with each user's own token. Local/catalog
# deployments ignore this block (their catalog is stage 1).
sources:
  - name: specquill-src
    remote: https://github.com/gitu/specquill.git

# references select granted sources by name (stage 3 of the authorization
# chain); `grounding: true` adds them to the speccy context. `regulations`
# resolves in catalog mode, `specquill-src` in forge-PAT mode — the other
# one degrades to an Overview warning.
references:
  - source: regulations
    grounding: true
  - source: specquill-src

# source-drift detection: the AI verifies documents against the selected
# references and files findings as work items. `targets` selects from the
# server's work_item_targets catalog (the project's own forge is always an
# implicit target); paths is the default run scope.
drift:
  references: [regulations]
  paths: [specs/, requirements/, data-mappings/]
  targets: [dev-board]
  # where THIS project keeps its alignment reports (project-relative: in a
  # monorepo it lands under the project's own content_root, beside this file).
  # {date}/{yyyy}/{mm}/{dd} expand at run time — a day's runs continue one
  # report, the next day starts a fresh one. Omit the tokens for a single
  # standing report.
  report: reports/alignment-{date}.md
